name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Check code formatting
        run: uv run ruff format --check ecox-data-platform/src ecox-client/src ecox-shared/src

      - name: Run linter
        run: uv run ruff check ecox-data-platform/src ecox-client/src ecox-shared/src

      - name: Type check
        run: uv run pyright ecox-data-platform/src ecox-client/src ecox-shared/src

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r ecox-data-platform/src ecox-client/src ecox-shared/src

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --dev

      - name: Run tests (per-package to avoid conftest collisions)
        run: |
          cd ecox-data-platform && uv run pytest tests/bdd/ -v --cov=src/ecox_platform --cov-report=xml
          cd ../ecox-client && uv run pytest tests/bdd/ -v --cov=src/ecox_client --cov-report=xml --cov-append
          cd ../ecox-shared && uv run pytest tests/bdd/ -v --cov=src/ecox_shared --cov-report=xml --cov-append

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

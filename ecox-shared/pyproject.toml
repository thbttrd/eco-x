[project]
name = "ecox-shared"
version = "1.0.0"
description = "Shared models and utilities for eco-x platform"
requires-python = ">=3.12"
authors = [
    { name = "Thibaut Troude" }
]
dependencies = [
    "sqlmodel>=0.0.24",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "aiolimiter>=1.1.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecox_shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
bdd_features_base_dir = "tests/features"
addopts = [
    "--cov=src/ecox_shared",
    "--cov-report=term-missing",
]
markers = [
    "epic_1: Data Source Browsing",
    "epic_2: Dataset Discovery",
    "epic_3: Real-Time Updates",
    "epic_4: Auto Refresh",
    "epic_5: News Aggregation",
    "epic_6: Eurostat Fetching",
    "epic_7: FRED Fetching",
    "epic_9: Storage History",
    "epic_10: Source Management",
    "epic_11: Internationalization",
    "epic_12: Performance",
    "epic_13: Migrations",
    "api: API endpoint tests",
    "ui: UI/template tests",
    "slow: Long-running tests",
    "wip: Work in progress",
]

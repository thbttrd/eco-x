[project]
name = "ecox-client"
version = "1.0.0"
description = "Web UI client for the ecox data platform"
requires-python = ">=3.12"
authors = [
    { name = "Thibaut Troude" }
]
dependencies = [
    # Database (SQLite for caching and preferences)
    "sqlmodel>=0.0.24",
    "aiosqlite>=0.20.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    # HTTP client for platform API
    "httpx>=0.27.0",
    # Utilities
    "structlog>=24.0.0",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.1.0",
    # SSE for real-time updates
    "sse-starlette>=2.0.0",
]

[project.scripts]
ecox-client = "ecox_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecox_client"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "greenlet>=3.0.0",
    "ruff>=0.5.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
bdd_features_base_dir = "tests/features"
addopts = [
    "--cov=src/ecox_client",
    "--cov-report=term-missing",
    "-m", "not superseded and not wip",
]
markers = [
    "epic_1: Data Source Browsing",
    "epic_2: Dataset Discovery",
    "epic_3: Real-Time Updates",
    "epic_4: Auto Refresh",
    "epic_5: News Aggregation",
    "epic_6: Eurostat Fetching",
    "epic_7: FRED Fetching",
    "epic_9: Storage History",
    "epic_10: Source Management",
    "epic_11: Internationalization",
    "epic_12: Performance",
    "epic_13: Migrations",
    "api: API endpoint tests",
    "ui: UI/template tests",
    "slow: Long-running tests",
    "wip: Work in progress",
    "superseded: Tests for superseded features (skipped)",
    "us_5_1: US-5.1 Browse News Sources",
    "us_5_6: US-5.6 Browse Articles",
    "us_5_7: US-5.7 Article Freshness",
    "us_5_8: US-5.8 Manual Refresh",
    "us_5_11: US-5.11 Browse Sections Tree (superseded)",
    "us_5_12: US-5.12 View Entry Content",
    "us_5_13: US-5.13 Section Fetch Status",
    "us_5_14: US-5.14 Chronological Feed",
    "us_5_15: US-5.15 Detail Panel",
    "us_5_16: US-5.16 Category Filter",
    "responsive: Responsive design tests",
    "error: Error handling tests",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]  # B008: Allow Depends/Query in FastAPI signatures

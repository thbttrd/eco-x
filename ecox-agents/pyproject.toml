[project]
name = "ecox-agents"
version = "1.0.0"
description = "AI agent service for eco-x platform"
requires-python = ">=3.12"
authors = [
    { name = "Thibaut Troude" }
]
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # AI framework
    "pydantic-ai>=1.0.0",
    "anthropic>=0.40.0",
    # HTTP client for platform API
    "httpx>=0.27.0",
    # Database for caching
    "sqlmodel>=0.0.16",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Redis for conversation memory
    "redis>=5.0.0",
    # Utilities
    "structlog>=24.0.0",
    "pydantic-settings>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecox_agents"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

# Alembic Configuration File
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path entries for model imports
prepend_sys_path = src

# Timezone for revision creation
# timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision' command
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without the source .py file
# sourceless = false

# Version location specification
# version_locations = %(here)s/alembic/versions

# Version path separator (os, :, ;)
# version_path_separator = :

# Output encoding
# output_encoding = utf-8

# Database URL - read from environment variable, fallback to SQLite
# sqlalchemy.url is handled in env.py to support environment variables


[post_write_hooks]
# Hook configuration for auto-formatting migration files
# Uncomment to enable ruff formatting after migration generation
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

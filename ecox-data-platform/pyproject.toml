[project]
name = "ecox-data-platform"
version = "1.0.0"
description = "Data platform for continuous economic data fetching"
requires-python = ">=3.12"
authors = [
    { name = "Thibaut Troude" }
]
dependencies = [
    # Shared package (local dependency)
    "ecox-shared",
    # Database
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30.0",  # PostgreSQL async driver
    "greenlet>=3.0.0",
    "alembic>=1.14.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data processing
    "pandas>=2.2.0",
    "pyyaml>=6.0.3",
    "defusedxml>=0.7.1",
    # HTML/XML parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "feedparser>=6.0.0",
    # SSE for real-time updates
    "sse-starlette>=2.0.0",
    # Utilities
    "structlog>=24.0.0",
]

[project.scripts]
ecox-platform = "ecox_platform.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecox_platform"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "factory-boy>=3.3.0",
    "ruff>=0.5.0",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.7.0",
    "aiosqlite>=0.22.0",
]

[tool.uv.sources]
ecox-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
bdd_features_base_dir = "tests/features"
addopts = [
    "--cov=src/ecox_platform",
    "--cov-report=term-missing",
]
markers = [
    "epic_1: Data Source Browsing",
    "epic_2: Dataset Discovery",
    "epic_3: Real-Time Updates",
    "epic_4: Auto Refresh",
    "epic_5: News Aggregation",
    "epic_6: Eurostat Fetching",
    "epic_7: FRED Fetching",
    "epic_9: Storage History",
    "epic_10: Source Management",
    "epic_11: Internationalization",
    "epic_12: Performance",
    "epic_13: Migrations",
    "api: API endpoint tests",
    "ui: UI/template tests",
    "slow: Long-running tests",
    "wip: Work in progress",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]  # B008: Allow Depends/Query in FastAPI signatures
